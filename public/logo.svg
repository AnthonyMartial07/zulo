<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Chabola: tablones torcidos, chapa ondulada, puerta descolgada y una piedra encima -->
  <!-- Paredes de tablones -->
  <path d="M10 30 L54 25 L55 56 L9 57 Z" fill="#8b5a2b"/>
  <g stroke="#5e3a17" stroke-width="1.6">
    <path d="M17 29 L16.5 57"/>
    <path d="M24 28.3 L24.5 57"/>
    <path d="M31 27.5 L30.5 56.5"/>
    <path d="M39 26.6 L39.5 56.3"/>
    <path d="M47 25.8 L46.5 56.1"/>
  </g>
  <!-- Parche de chapa en la pared -->
  <rect x="40" y="34" width="10" height="8" fill="#9aa3a8" transform="rotate(-6 45 38)"/>
  <circle cx="41.5" cy="35.5" r="0.8" fill="#444"/>
  <circle cx="48.5" cy="40.5" r="0.8" fill="#444"/>
  <!-- Puerta descolgada -->
  <path d="M20 37 L30 36 L31 57 L21.5 57.5 Z" fill="#3b2412" transform="rotate(4 25 47)"/>
  <circle cx="28.3" cy="47" r="0.9" fill="#d9b44a"/>
  <!-- Tejado de chapa ondulada, inclinado -->
  <path d="M5 31 L57 21 L59 27 L6 36 Z" fill="#a9b1b5"/>
  <g stroke="#6f777b" stroke-width="1.2">
    <path d="M12 30 L13 34.8"/>
    <path d="M20 28.5 L21 33.4"/>
    <path d="M28 27 L29 32"/>
    <path d="M36 25.4 L37 30.6"/>
    <path d="M44 23.9 L45 29.2"/>
    <path d="M52 22.3 L53 27.8"/>
  </g>
  <path d="M5 31 L57 21" stroke="#c97a3a" stroke-width="1.2" stroke-dasharray="3 5"/>
  <!-- Piedra sujetando la chapa -->
  <ellipse cx="38" cy="24.5" rx="4" ry="2.6" fill="#6b6b6b"/>
  <!-- Ventanuco tapado con cartón -->
  <rect x="34" y="40" width="5" height="5" fill="#d8b56d" transform="rotate(-3 36.5 42.5)"/>
  <!-- Suelo -->
  <path d="M4 57.5 Q32 55 60 57.5" stroke="#4a3b2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
